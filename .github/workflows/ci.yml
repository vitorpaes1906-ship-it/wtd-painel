name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install          # troque por `npm ci` depois de versionar o package-lock.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:site
